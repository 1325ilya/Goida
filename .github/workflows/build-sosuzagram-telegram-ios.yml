name: Build Sosuzagram (Telegram-iOS fork)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (e.g. release_arm64)'
        required: true
        default: 'release_arm64'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Sosuzagram overlay repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/telegram-bazel-cache
          key: ${{ runner.os }}-bazel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ github.sha }}-${{ github.run_id }}-
            ${{ runner.os }}-bazel-${{ github.sha }}-
            ${{ runner.os }}-bazel-
            
      - name: Bootstrap Telegram-iOS upstream
        run: bash ./scripts/bootstrap_telegram_ios.sh
        
      - name: Apply Sosuzagram Overlay & Patches
        run: bash ./scripts/apply_sosuzagram_overlay.sh
        
      - name: Generate Build Configuration
        run: bash ./scripts/generate_build_config.sh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEAM_ID: ${{ secrets.TEAM_ID || '0000000000' }}
          BUNDLE_ID: 'org.burmalda.zagram'
          APP_TITLE: 'BurmalGram'
          
      - name: Patch Provisioning Profiles
        run: |
          cd upstream/Telegram-iOS
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          cd ../..
          python3 scripts/patch_fake_profiles.py
          
      - name: Select Xcode Version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode* | sort -rV | head -n 1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Build IPA (GBOX-Resignable)
        run: |
          BUILD_NUMBER=$GITHUB_RUN_NUMBER \
          BUILD_CONFIGURATION="${{ inputs.build_configuration }}" \
          TELEGRAM_BAZEL_CACHE_DIR="$HOME/telegram-bazel-cache" \
            bash ./scripts/build_gbox_resignable_telegram_ipa.sh
          cp build/artifacts/gbox/Sosuzagram-Telegram-iOS-gbox-resignable.ipa \
            upstream/Telegram-iOS/Sosuzagram-Telegram-iOS-gbox-resignable.ipa

      - name: Upload GBOX-Resignable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sosuzagram-Telegram-iOS-gbox-resignable-ipa
          path: upstream/Telegram-iOS/Sosuzagram-Telegram-iOS-gbox-resignable.ipa

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: sosuzagram-ios-full-${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" \
            upstream/Telegram-iOS/Sosuzagram-Telegram-iOS-gbox-resignable.ipa \
            --target "$GITHUB_SHA" \
            --title "Sosuzagram iOS (Full Telegram Fork) #${{ github.run_number }}" \
            --notes "GBOX-friendly resignable Telegram-iOS build. Built with app extensions enabled so BurmalGram keeps system notifications outside the app and preserves Telegram's notification service pipeline."

      - name: Save Bazel cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /Users/runner/telegram-bazel-cache
          key: ${{ runner.os }}-bazel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
