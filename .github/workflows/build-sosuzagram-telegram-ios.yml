name: Build Sosuzagram (Telegram-iOS fork)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (e.g. release_arm64)'
        required: true
        default: 'release_arm64'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Sosuzagram overlay repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Bootstrap Telegram-iOS upstream
        run: ./scripts/bootstrap_telegram_ios.sh
        
      - name: Apply Sosuzagram Overlay & Patches
        run: ./scripts/apply_sosuzagram_overlay.sh
        
      - name: Generate Build Configuration
        run: ./scripts/generate_build_config.sh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEAM_ID: ${{ secrets.TEAM_ID || '0000000000' }}
          BUNDLE_ID: 'org.sosuzagram.ios'
          APP_TITLE: 'Sosuzagram'
          
      - name: Select Xcode Version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode* | sort -rV | head -n 1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Build IPA (Unsigned/Resignable)
        run: |
          cd upstream/Telegram-iOS
          python3 build-system/Make/Make.py \
              --cacheDir="$HOME/telegram-bazel-cache" \
              --overrideXcodeVersion \
              --overrideBazelVersion \
              build \
              --configurationPath=build-system/template_minimal_development_configuration.json \
              --configuration=${{ github.event.inputs.build_configuration }} \
              --buildNumber=$GITHUB_RUN_NUMBER \
              --xcodeManagedCodesigning
              
          # If Make.py doesn't directly package IPA without codesigning, we will find the .app in bazel-out and package it
          APP_PATH=$(find bazel-out -name "Telegram.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -qr Sosuzagram-Telegram-iOS-unsigned.ipa Payload
          else
            echo "Error: Telegram.app not found in bazel-out"
            exit 1
          fi

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sosuzagram-Telegram-iOS-unsigned-ipa
          path: upstream/Telegram-iOS/Sosuzagram-Telegram-iOS-unsigned.ipa

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: sosuzagram-ios-full-${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" \
            upstream/Telegram-iOS/Sosuzagram-Telegram-iOS-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "Sosuzagram iOS (Full Telegram Fork) #${{ github.run_number }}" \
            --notes "Unsigned/resignable full Telegram-iOS client with Local Message History. Sign it with your own certificate before installing."
