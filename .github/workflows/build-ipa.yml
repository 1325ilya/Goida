name: Build Sosuzagram IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sosuzagram-ios26-unsigned-ipa
          path: build/ios/artifacts/Sosuzagram-ios26-unsigned.ipa
          if-no-files-found: error
